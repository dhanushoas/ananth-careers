# Self-hosted alternative (VPS): Nginx serves the Angular build and proxies /api to Node.
# Certificates via certbot:  sudo certbot --nginx -d ananth.example.in -d www.ananth.example.in
limit_req_zone $binary_remote_addr zone=ananth_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ananth.example.in www.ananth.example.in;
    return 301 https://ananth.example.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ananth.example.in;

    ssl_certificate     /etc/letsencrypt/live/ananth.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ananth.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 6m;   # resumes are limited to 5 MB by the API
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/ananth/frontend/browser;
    index index.html;

    location /api/ {
        limit_req zone=ananth_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://127.0.0.1:4000; }

    # Hashed assets: cache forever.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
